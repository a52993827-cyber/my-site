<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 сайт</title>
    <style>
        :root {
            --ink: #1d1b4d;
            --sun: #ffd23f;
            --coral: #ff6b6b;
            --mint: #3ddbb0;
            --paper: #fff8ec;
        }
        * { box-sizing: border-box;}
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--coral), var(--sun), var(--mint));
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            background: var(--paper);
            border: 4px solid var(--ink);
            border-radius: 28px;
            box-shadow: 10px 10px 0 var(--ink);
            text-align: center;
        }
        .avatar {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            font-size: 60px;
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 50%;
        }
        h1{
            margin: 0 0 6px;
            font-size: 2rem;
        }
        .role{
            margin: 0 0 20px;
            font-weight: bold;
            color: var(--coral);
        }
        p {
            line-height: 1.5;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 20px 0 26px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }
        li {
            padding: 8px 14px;
            background: var(--mint);
            border: 3px solid var(--ink);
            border-radius: 999px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        li:active {
            transform: scale(0.98);
        }
        button {
            font: inherit;
            font-weight: bold;
            padding: 14px 28px;
            color: var(--ink);
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 16px;
            box-shadow: 5px 5px 0 var(--ink);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 var(--ink);
        }
        button:active {
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 var(--ink);
        }
        button:focus-visible {
            outline: 4px solid var(--coral);
            outline-offset: 4px;
        }
        #hello {
            min-height: 1.5em;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* --- СТИЛИ ДЛЯ МОДАЛЬНОГО ОКНА --- */
        #myModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #closeModal {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: var(--sun);
            border: 4px solid var(--ink);
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            z-index: 1001;
            box-shadow: 5px 5px 0 var(--ink);
        }
        #closeModal:active {
            transform: translate(5px, 5px);
            box-shadow: 0 0 0 var(--ink);
        }
        #modalContent {
            width: 90%;
            height: 90%;
            background: white;
            border-radius: 20px;
            border: 4px solid var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
    </style>
</head>
<body>

    <!-- Кнопка "Поделиться" в правом верхнем углу -->
    <button id="btn-share" style="position: fixed; top: 20px; right: 20px; z-index: 999; padding: 10px 20px; background: #3ddbb0; border: 3px solid #1d1b4d; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0 #1d1b4d;">🔗 Поделиться</button>

    <main class="card">
        <div class="avatar">🐢</div>
        <h1>Привет, я Александр!</h1>
        <p class="role">Юный веб-дизайнер</p>
        <p>Учусь на веб-дизайнера</p>
        <ul>
            <li id="btn-games">🎮 Игры</li>
            <li id="btn-paint">🎨 Рисование</li>
            <li id="btn-space">🚀 Космос</li>
            <li id="btn-cats">🐱 Котики</li>
        </ul>
        <button id="btn">Нажми меня</button>
        <p id="hello"></p>
    </main>

    <!-- Модальное окно -->
    <div id="myModal">
        <button id="closeModal">Закрыть ❌</button>
        <div id="modalContent">
            <!-- Контент появится здесь -->
        </div>
    </div>

    <script>
        // --- 1. Кнопка "Нажми меня" ---
        const phrases = ["Ура, я это сделал!"];
        let n = 0;
        document.getElementById("btn").addEventListener("click", function () {
            document.getElementById("hello").textContent = phrases[n % phrases.length];
            n++;
        });

        // --- 2. Модальное окно ---
        const modal = document.getElementById("myModal");
        const modalContent = document.getElementById("modalContent");
        const closeBtn = document.getElementById("closeModal");

        function openModal(htmlContent) {
            modalContent.innerHTML = htmlContent;
            modal.style.display = "flex";
        }

        closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
            modalContent.innerHTML = "";
        });

        function closeModalFunc() {
            modal.style.display = "none";
            modalContent.innerHTML = "";
        }

        // --- 3. Кнопки меню ---

        // Функция для возврата в меню игр
        function backToGamesMenu() {
            document.getElementById("btn-games").click();
        }

        // Игры (Меню выбора)
        document.getElementById("btn-games").addEventListener("click", () => {
            openModal(`
                <div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: #f0f0f0;">
                    <div style="padding: 10px; background: #00e5b5; border-bottom: 2px solid #1a1a1a;">
                        <h3 style="margin: 0; color: #1a1a1a; text-align: center;">Выбери игру:</h3>
                    </div>
                    <div style="display: flex; flex-wrap: wrap; width: 100%; flex: 1; overflow-y: auto;">
                        <div onclick="showRules('dino')" style="width: 33%; height: 50%; display: flex; justify-content: center; align-items: center; background: #f0f0f0; cursor: pointer; border: 1px solid #ccc; font-size: 18px; font-weight: bold; flex-direction: column;">
                            <span style="font-size: 80px;">🦖</span>Динозаврик
                        </div>
                        <div onclick="showRules('2048')" style="width: 33%; height: 50%; display: flex; justify-content: center; align-items: center; background: #f0f0f0; cursor: pointer; border: 1px solid #ccc; font-size: 18px; font-weight: bold; flex-direction: column;">
                            <span style="font-size: 80px;">🧩</span>2048
                        </div>
                        <div onclick="showRules('blockblast')" style="width: 33%; height: 50%; display: flex; justify-content: center; align-items: center; background: #f0f0f0; cursor: pointer; border: 1px solid #ccc; font-size: 18px; font-weight: bold; flex-direction: column;">
                            <span style="font-size: 80px;">🧱</span>Block Blast
                        </div>
                        <div onclick="showRules('sudoku')" style="width: 33%; height: 50%; display: flex; justify-content: center; align-items: center; background: #f0f0f0; cursor: pointer; border: 1px solid #ccc; font-size: 18px; font-weight: bold; flex-direction: column;">
                            <span style="font-size: 80px;">🔢</span>Судоку
                        </div>
                        <div onclick="showRules('watersort')" style="width: 33%; height: 50%; display: flex; justify-content: center; align-items: center; background: #f0f0f0; cursor: pointer; border: 1px solid #ccc; font-size: 18px; font-weight: bold; flex-direction: column;">
                            <span style="font-size: 80px;">🧪</span>Water Sort
                        </div>
                        <div onclick="showRules('onet')" style="width: 33%; height: 50%; display: flex; justify-content: center; align-items: center; background: #f0f0f0; cursor: pointer; border: 1px solid #ccc; font-size: 18px; font-weight: bold; flex-direction: column;">
                            <span style="font-size: 80px;">🀄</span>Onet
                        </div>
                    </div>
                </div>
            `);
        });

        // Функция показа правил
        function showRules(gameType) {
            let rulesText = "";
            let warningText = ""; 

            if (gameType === 'dino') {
                rulesText = "Нажимай ПРОБЕЛ или СТРЕЛКУ ВВЕРХ, чтобы динозаврик прыгал. Не врезайся в кактусы!";
                warningText = "Перед началом игры обязательно нажми левой кнопкой мыши по игровому полю!";
            } else if (gameType === '2048') {
                rulesText = "Используй СТРЕЛКИ на клавиатуре, чтобы двигать плитки. Соединяй одинаковые цифры, чтобы получить 2048!";
                warningText = "Перед началом игры обязательно нажми левой кнопкой мыши по игровому полю!";
            } else if (gameType === 'blockblast') {
                rulesText = "Перетаскивай блоки на поле, чтобы заполнить линии и очистить их. Игра закончится, когда не будет места для нового блока.";
                warningText = "Перед началом игры нажми левой кнопкой мыши по полю, чтобы игра слушала твои действия!";
            } else if (gameType === 'sudoku') {
                rulesText = "Заполни сетку 9x9 цифрами от 1 до 9 так, чтобы в каждой строке, столбце и квадрате 3x3 цифры не повторялись.";
                warningText = "Перед началом игры нажми левой кнопкой мыши по полю, чтобы игра слушала твои действия!";
            } else if (gameType === 'watersort') {
                rulesText = "Переливай воду между колбами, чтобы собрать в каждой колбе воду одного цвета. Нажимай на колбу, чтобы выбрать, и на другую — чтобы перелить.";
                warningText = "Перед началом игры нажми левой кнопкой мыши по полю, чтобы игра слушала твои действия!";
            } else if (gameType === 'onet') {
                rulesText = "Находи одинаковые картинки и соединяй их линией, которая не пересекает другие картинки. Соединяй как можно быстрее!";
                warningText = "Перед началом игры нажми левой кнопкой мыши по полю, чтобы игра слушала твои действия!";
            }

            openModal(`
                <div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: #fff8ec; padding: 20px; box-sizing: border-box;">
                    <h2 style="color: #1d1b4d; text-align: center;">Правила игры</h2>
                    <p style="color: #333; font-size: 18px; line-height: 1.6; flex: 1;">${rulesText}</p>
                    
                    <!-- Красный текст предупреждения -->
                    <p style="color: red; font-weight: bold; font-size: 16px; margin-bottom: 20px;">
                        ${warningText}
                    </p>

                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <button onclick="backToGamesMenu()" style="padding: 12px 24px; background: #ff4d4d; border: 4px solid #1d1b4d; border-radius: 16px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 5px 5px 0 #1d1b4d; color: white;">← В меню игр</button>
                        <button onclick="startGame('${gameType}')" style="padding: 12px 24px; background: #3ddbb0; border: 4px solid #1d1b4d; border-radius: 16px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 5px 5px 0 #1d1b4d;">Играть ▶</button>
                    </div>
                </div>
            `);
        }

        // Функция запуска игры
        function startGame(gameType) {
            let gameUrl = '';
            if (gameType === 'dino') {
                gameUrl = 'https://imkennyyip.github.io/chrome-dinosaur-game/';
            } else if (gameType === '2048') {
                gameUrl = 'https://monicatvera.github.io/2048/'; 
            } else if (gameType === 'blockblast') {
                gameUrl = 'https://blockblast.pro/'; 
            } else if (gameType === 'sudoku') {
                gameUrl = 'https://sudokum.ru/'; 
            } else if (gameType === 'watersort') {
                gameUrl = 'https://cpscount.com/water-sort/'; 
            } else if (gameType === 'onet') {
                gameUrl = 'https://gamesnacks.com/games/onetconnectclassic/'; 
            }

            openModal(`
                <div style="width: 100%; height: 100%; display: flex; flex-direction: column;">
                    <div style="padding: 10px; background: #1a1a1a; display: flex; gap: 10px; justify-content: center;">
                        <button onclick="backToGamesMenu()" style="padding: 8px 20px; background: #ff4d4d; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; box-shadow: none;">❌ Выйти в меню</button>
                    </div>
                    <iframe src="${gameUrl}" style="width: 100%; height: 100%; border: none;" allowfullscreen></iframe>
                </div>
            `);
        }

        // Рисование
        document.getElementById("btn-paint").addEventListener("click", () => {
            openModal(`<iframe src="https://jspaint.app/" style="width: 100%; height: 100%; border: none;"></iframe>`);
        });

        // Космос (локальная гифка)
        document.getElementById("btn-space").addEventListener("click", () => {
            openModal(`<img src="space.gif.gif" alt="Космос" style="max-width: 100%; max-height: 100%; object-fit: contain;">`);
        });

        // Котики (локальный файл)
        document.getElementById("btn-cats").addEventListener("click", () => {
            openModal(`<img src="cat.jpeg.JPEG" alt="Котик" style="max-width: 100%; max-height: 100%; object-fit: contain;">`);
        });

        // --- 5. Кнопка "Поделиться" ---
        document.getElementById("btn-share").addEventListener("click", async () => {
            const url = window.location.href;

            // Проверяем, не локальный ли это адрес
            if (url.startsWith("file://")) {
                alert("Сейчас сайт открыт как локальный файл. Чтобы ссылка работала на других устройствах, сайт нужно опубликовать в интернете (например, на GitHub Pages или Netlify).");
                return;
            }

            try {
                await navigator.clipboard.writeText(url);
                alert("Ссылка скопирована! Можешь отправить её другу.");
            } catch (err) {
                prompt("Скопируй эту ссылку и отправь другу:", url);
            }
        });
    </script>
</body>
</html>
